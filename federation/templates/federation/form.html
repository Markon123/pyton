{% extends 'federation/base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">УПРАВЛЕНИЕ ДАННЫМИ</span><h1>{{ title }}</h1></div>{% if cancel_url %}<a href="{{ cancel_url }}" class="button secondary">Назад</a>{% else %}<a href="{% url 'dashboard' %}" class="button secondary">Назад</a>{% endif %}</div><section class="panel form-panel"><form method="post" enctype="multipart/form-data" class="form-stack">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button class="button primary" type="submit">{{ submit_label|default:"Сохранить" }} <span><svg class="icon ui-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></button>{% if cancel_url %}<a href="{{ cancel_url }}" class="button secondary">Отмена</a>{% endif %}</div></form></section>{% endblock %}
